<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso | Felipe Marinho</title>
    <link rel="icon" type="image/jpeg" href="public/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .success-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        .success-page h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            margin-bottom: 1rem;
        }
        .success-page p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 3rem;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <main class="success-page">
        <h1 class="animate-up">Mensagem <span class="gradient-text">Enviada!</span></h1>
        <p class="animate-up delay-1">Obrigado por entrar em contato. Lerei sua mensagem e retornarei o mais breve possível.</p>
        <div class="animate-up delay-2">
            <a href="/" class="btn btn-primary">Voltar para o Início</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
